<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aesthetic Virtual — Practice Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="mk"></span> Aesthetic Virtual <span class="brand-sub">Practice Console</span></div>
  <div class="topright">
    <button class="linkbtn" id="resetDemo">↺ Reset demo</button>
    <a class="linkbtn" href="../patient/" target="_blank">Patient flow ↗</a>
    <a class="linkbtn" href="../" target="_blank">Concept ↗</a>
  </div>
</header>

<main class="view">
  <div class="view-head">
    <div><h2>Consult queue</h2><p class="muted" id="queueNote">—</p></div>
    <div class="filters" id="filters">
      <button class="chipf active" data-filter="all">All</button>
      <button class="chipf" data-filter="hot">🔥 Hot</button>
      <button class="chipf" data-filter="warm">Warm</button>
      <button class="chipf" data-filter="awaiting">Sent · awaiting</button>
    </div>
  </div>
  <div class="lead-list" id="leadList"></div>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer"></aside>

<!-- CONSULT STUDIO (full-screen) -->
<div class="studio-fs" id="studio">
  <div class="sfs-top">
    <div class="sfs-title">🎬 Consult Studio <span id="studioPatient"></span></div>
    <button class="linkbtn" onclick="AV.closeStudio()">✕ Exit</button>
  </div>
  <div class="sfs-body">
    <div class="sfs-slides">
      <div class="ss-title">Slides</div>
      <div class="slide-strip" id="slideStrip"></div>
      <button class="addslide" onclick="AV.addTextSlide()">+ Add text slide</button>
    </div>
    <div class="sfs-stage">
      <div class="stage-wrap">
        <canvas id="stage" width="1280" height="720"></canvas>
        <video id="recVideo" playsinline autoplay muted></video>
        <div class="rec-dot" id="recDot" hidden>● REC <span id="recTime">0:00</span></div>
        <div class="teleprompter" id="teleprompter"></div>
      </div>
      <div class="slide-nav">
        <button class="snav" onclick="AV.prevSlide()">‹ Prev</button>
        <span id="slideCount">1 / 1</span>
        <button class="snav" onclick="AV.nextSlide()">Next ›</button>
        <span class="spacer"></span>
        <button class="snav" id="pipToggle" onclick="AV.cyclePip()">📹 Camera: bottom-right</button>
        <button class="snav" id="teleToggle" onclick="AV.toggleTele()">📝 Script: on</button>
      </div>
    </div>
    <div class="sfs-panel">
      <div class="ptabs">
        <button class="ptab on" data-tab="edit" onclick="AV.tab('edit')">Edit slide</button>
        <button class="ptab" data-tab="ba" onclick="AV.tab('ba')">Before &amp; afters</button>
      </div>
      <div class="pbody" id="tabEdit"></div>
      <div class="pbody" id="tabBa" hidden>
        <input class="search" id="baSearch" placeholder="Search before &amp; afters…" oninput="AV.filterBa(this.value)">
        <div class="ba-lib" id="baLib"></div>
        <label class="uploadcase">+ Upload a before &amp; after<input type="file" id="baUpload" accept="image/*" multiple hidden></label>
        <div class="upnote">Pick two images — first is the <b>before</b>, second the <b>after</b>.</div>
      </div>
    </div>
  </div>
  <div class="sfs-bottom">
    <div class="sfs-hint">Present the case slide-by-slide, then record. Slides auto-build from the lead.</div>
    <div class="rb-right">
      <button class="cta-d" id="recToggle" onclick="AV.toggleRecord()">● Start recording</button>
      <button class="cta-d ghost-d" id="recUse" onclick="AV.useRecording()" hidden>Use this take →</button>
    </div>
  </div>
</div>

<!-- CLOSING PAGE / PATIENT EMAIL PREVIEW -->
<div class="modal" id="emailModal">
  <div class="modal-card email-card" id="emailCard"></div>
</div>

<script src="../store.js"></script>
<script src="app.js"></script>
</body>
</html>
